name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: Enable Corepack
        run: corepack enable

      - name: Validate cloud boundary
        run: node scripts/validate-cloud-boundary.mjs

      - name: Validate patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Require a lockfile when application code exists
        shell: bash
        run: |
          if [[ -f package.json && ! -f pnpm-lock.yaml ]]; then
            echo "package.json exists without pnpm-lock.yaml"
            exit 1
          fi

      - name: Install locked dependencies
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        run: pnpm install --frozen-lockfile

      - name: Run credentialless quality scripts
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          for script in lint typecheck test:unit; do
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.['$script'] ? 0 : 1)"; then
              pnpm "$script"
            fi
          done
